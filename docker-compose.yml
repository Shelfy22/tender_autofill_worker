services:
  tender-redis:
    image: redis:7.4-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./docker/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - tender-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - tender-queue

  tender-api:
    build: .
    env_file: ${ENV_FILE:-.env}
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    ports:
      - "${TENDER_API_PORT:-8000}:8000"
    depends_on:
      tender-redis:
        condition: service_healthy
    networks:
      - default
      - tender-queue
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s

  tender-worker:
    build: .
    env_file: ${ENV_FILE:-.env}
    command:
      - celery
      - -A
      - app.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --pool=prefork
      - --concurrency=1
      - --prefetch-multiplier=1
      - --max-tasks-per-child=1
    depends_on:
      tender-redis:
        condition: service_healthy
    networks:
      - default
      - tender-queue
    mem_limit: ${WORKER_MEMORY_LIMIT:-4g}
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app:celery_app inspect ping --destination celery@$$HOSTNAME --timeout=10 | grep -q pong"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 45s
    restart: unless-stopped
    stop_grace_period: 90s

volumes:
  tender-redis-data:

networks:
  tender-queue:
    internal: true
